[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-local"
version = "0.2.0"
description = "Evidence-grounded resume tailoring and local job application queues"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
documents = ["python-docx>=1.1,<2", "pypdf>=5,<7"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.packages.find]
include = ["jobpilot*"]
